<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Stage 3B-12 synthetic observation</title>
<h1>Isolated synthetic storage only</h1><p>HOLD. No product authority. Completion is not media durability. Export before closing; unobserved actions remain UNKNOWN. No automatic retry.</p>
<button id="start">Create new synthetic trial</button><button id="write" disabled>One synthetic update</button><button id="read" disabled>Read diagnosis only</button><button id="export">Export observation JSON</button><pre id="output" aria-live="polite"></pre>
<script type="module">
import {startAtomic} from '/fixture.mjs';
let api,request,used=false;const record={schema:1,mode:'manual-unverified',physicalAcceptance:'NOT_TESTED',durability:'UNKNOWN',executionAllowed:false,writeAllowed:false,authority:'NOT_ESTABLISHED',events:[],startedAt:new Date().toISOString(),metadata:{device:'UNKNOWN',os:'UNKNOWN',browser:'UNKNOWN',head:'UNKNOWN',case:'UNKNOWN'}};
const output=document.querySelector('#output'),show=()=>output.textContent=JSON.stringify(record,null,2);
const run=async f=>{try{await f();}catch(e){record.error=String(e);record.observation='UNKNOWN';}show();};
document.querySelector('#start').onclick=()=>run(async()=>{if(api)throw Error('trial-already-started');record.namespace='stage3b11-test-'+crypto.randomUUID();api=startAtomic({namespace:record.namespace,pageId:'manual'},e=>record.events.push(e));record.before=await api.initialize();request=await api.request('manual-op','SYNTHETIC');record.request=request;document.querySelector('#start').disabled=true;document.querySelector('#write').disabled=false;document.querySelector('#read').disabled=false;});
document.querySelector('#write').onclick=()=>run(async()=>{if(used)throw Error('replay-prohibited');used=true;document.querySelector('#write').disabled=true;record.result=await api.update(request);record.after=await api.snapshot();});
document.querySelector('#read').onclick=()=>run(async()=>{record.diagnosis=await api.diagnose('manual-op');});
document.querySelector('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(record,null,2)],{type:'application/json'}));a.download='stage3b12-'+(record.namespace||'not-started')+'.json';a.click();URL.revokeObjectURL(a.href);};
show();
</script></html>
