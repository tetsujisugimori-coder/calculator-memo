name: PR 103 diagnostic scaffold (incomplete)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout fixed application code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 52f4f6914fcd3c72b0829018842f653f06abe5f2
          persist-credentials: false
      - name: Verify fixed checkout
        run: test "$(git rev-parse HEAD)" = 52f4f6914fcd3c72b0829018842f653f06abe5f2
      - name: Set up pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Record contract test
        run: |
          mkdir -p diagnostic-evidence
          set -o pipefail
          node --test e2e/ci-contract.node-test.mjs 2>&1 | tee diagnostic-evidence/contract.log
      - name: Stop because GUI diagnostic is not implemented
        run: |
          echo 'INCOMPLETE: No GUI diagnostic has run.' | tee diagnostic-evidence/incomplete.txt
          exit 1
      - name: Preserve available diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr103-diagnostic-incomplete-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostic-evidence/
          retention-days: 7
          if-no-files-found: error
