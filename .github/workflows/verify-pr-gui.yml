name: PR GUI regression
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: pr-gui-${{ github.event.pull_request.number }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  gui:
    name: Checks and Chromium GUI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BRANCH: ${{ github.head_ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      CI: "true"
    steps:
      - name: Checkout exact PR head
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up pinned Node
        id: node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.0
      - name: Install locked app dependencies
        id: app_install
        run: |
          mkdir -p gui-evidence
          npm ci --ignore-scripts 2>&1 | tee gui-evidence/app-install.log
      - name: Existing unit tests
        id: unit
        run: npm test 2>&1 | tee gui-evidence/unit.log
      - name: Lint
        id: lint
        run: npm run lint 2>&1 | tee gui-evidence/lint.log
      - name: Type check
        id: types
        run: npx --no-install tsc --noEmit 2>&1 | tee gui-evidence/types.log
      - name: Normal application build
        id: normal_build
        run: npm run build 2>&1 | tee gui-evidence/normal-build.log
      - name: Pages static build
        id: pages_build
        run: npm run build:pages 2>&1 | tee gui-evidence/pages-build.log
      - name: Install locked isolated GUI dependencies
        id: gui_install
        run: npm ci --prefix e2e --ignore-scripts 2>&1 | tee gui-evidence/gui-install.log
      - name: Install matching Chromium and system libraries
        id: browser_install
        run: node e2e/node_modules/playwright/cli.js install --with-deps chromium 2>&1 | tee gui-evidence/browser-install.log
      - name: Desktop and narrow GUI regression
        id: gui
        run: node e2e/smoke.mjs 2>&1 | tee gui-evidence/gui.log
      - name: Preserve outcomes even when setup or tests fail
        if: always()
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          mkdir -p gui-evidence
          node <<'NODE'
          const fs = require('node:fs');
          const steps = JSON.parse(process.env.STEP_OUTCOMES);
          const outcomes = Object.fromEntries(Object.entries(steps).map(([key, value]) => [key, value.outcome]));
          const failed = Object.entries(outcomes).filter(([, value]) => value === 'failure').map(([key]) => key);
          const diagnostic = {
            expectedSha: process.env.EXPECTED_SHA, branch: process.env.PR_BRANCH,
            run: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
            recordedAt: new Date().toISOString(), node: process.version,
            runnerImage: process.env.ImageOS, runnerVersion: process.env.ImageVersion,
            outcomes, failedStages: failed,
            interpretation: 'Stage is observed; application/test/environment root cause requires logs and trace diagnosis.'
          };
          fs.writeFileSync('gui-evidence/ci-outcomes.json', JSON.stringify(diagnostic, null, 2) + '\n');
          const safe = value => String(value).replace(/[\x00-\x1f<>\x60]/g, '_');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## PR GUI regression\n\nExact PR head: ' + safe(diagnostic.expectedSha) +
            '\n\nBranch: ' + safe(diagnostic.branch) +
            '\n\nObserved stage outcomes:\n' +
            Object.entries(outcomes).map(([key, value]) => '- ' + key + ': ' + value).join('\n') +
            '\n\nArtifacts contain synthetic screenshots, per-width traces, provenance, and stage logs. Assertion failures require diagnosis; they are not automatically application defects.\n');
          NODE
      - name: Upload diagnostic evidence
        id: artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-gui-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: gui-evidence/
          retention-days: 7
          if-no-files-found: error
      - name: Link evidence from PR check summary
        if: always() && steps.artifact.outcome == 'success'
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: printf '\n[Download GUI screenshots, traces and diagnostics](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

