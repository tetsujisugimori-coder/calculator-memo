        run: |
          GUI_EVIDENCE_DIR=gui-evidence/quote-overflow/narrow node e2e/run-stage.mjs quote-overflow-narrow timeout --signal=TERM --kill-after=10s 300s node e2e/quote-overflow.mjs . narrow --expect-fit --causal --negative-control
