name: PR GUI regression
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: pr-gui-${{ github.event.pull_request.number }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  gui:
    name: Checks and Chromium GUI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BRANCH: ${{ github.head_ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      CI: "true"
    steps:
      - name: Checkout exact PR head
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up pinned Node
        id: node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.0
          # Verification/artifact upload must not compete with optional post-job cache saving.
          package-manager-cache: false
      - name: Install locked app dependencies
        id: app_install
        run: |
          mkdir -p gui-evidence
          node e2e/run-stage.mjs app-install npm ci --ignore-scripts
      - name: CI failure and coverage contracts
        id: ci_contract
        run: node e2e/run-stage.mjs ci-contract node --test e2e/ci-contract.node-test.mjs
      - name: Existing unit tests
        id: unit
        run: node e2e/run-stage.mjs unit npm test
      - name: Lint
        id: lint
        run: node e2e/run-stage.mjs lint npm run lint
      - name: Type check
        id: types
        run: node e2e/run-stage.mjs types npx --no-install tsc --noEmit
      - name: Normal application build
        id: normal_build
        run: node e2e/run-stage.mjs normal-build npm run build
      - name: Pages static build
        id: pages_build
        run: node e2e/run-stage.mjs pages-build npm run build:pages
      - name: Install locked isolated GUI dependencies
        id: gui_install
        run: node e2e/run-stage.mjs gui-install npm ci --prefix e2e --ignore-scripts
      - name: Configure bounded official Ubuntu package acquisition
        id: apt_config
        run: node e2e/run-stage.mjs apt-config sudo --preserve-env=GITHUB_ACTIONS "$(command -v node)" e2e/configure-ci-apt.mjs
      - name: Install matching browser system libraries (five-minute budget)
        id: os_install
        run: node e2e/run-stage.mjs os-install sudo timeout --verbose --signal=TERM --kill-after=10s 300s "$(command -v node)" e2e/node_modules/playwright/cli.js install-deps chromium webkit
      - name: Install matching Chromium and WebKit (three-minute budget)
        id: browser_install
        run: node e2e/run-stage.mjs browser-install timeout --verbose --signal=TERM --kill-after=10s 180s node e2e/node_modules/playwright/cli.js install chromium webkit
      - name: Desktop Chromium and mobile Chromium/WebKit touch regression
        id: gui
        run: node e2e/run-stage.mjs gui /usr/bin/time -v -o gui-evidence/gui-resources.log node e2e/smoke.mjs
      - name: Preserve outcomes even when setup or tests fail
        if: always()
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          mkdir -p gui-evidence
          node <<'NODE'
          const fs = require('node:fs');
          const steps = JSON.parse(process.env.STEP_OUTCOMES);
          const outcomes = Object.fromEntries(Object.entries(steps).map(([key, value]) => [key, value.outcome]));
          const failed = Object.entries(outcomes).filter(([, value]) => value === 'failure').map(([key]) => key);
          const diagnostic = {
            expectedSha: process.env.EXPECTED_SHA, branch: process.env.PR_BRANCH,
            run: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
            recordedAt: new Date().toISOString(), node: process.version,
            runnerImage: process.env.ImageOS, runnerVersion: process.env.ImageVersion,
            outcomes, failedStages: failed,
            interpretation: 'Stage is observed; application/test/environment root cause requires logs and trace diagnosis.'
          };
          fs.writeFileSync('gui-evidence/ci-outcomes.json', JSON.stringify(diagnostic, null, 2) + '\n');
          const safe = value => String(value).replace(/[\x00-\x1f<>\x60]/g, '_');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## PR GUI regression\n\nExact PR head: ' + safe(diagnostic.expectedSha) +
            '\n\nBranch: ' + safe(diagnostic.branch) +
            '\n\nObserved stage outcomes:\n' +
            Object.entries(outcomes).map(([key, value]) => '- ' + key + ': ' + value).join('\n') +
            '\n\nArtifacts contain representative synthetic screenshots, complete geometry checkpoint records, pre-failure DOM/action traces for failed contexts, provenance, timings and stage logs. Assertion failures require diagnosis; they are not automatically application defects.\n');
          NODE
      - name: Inventory diagnostic evidence
        id: inventory
        if: always()
        run: node e2e/evidence-inventory.mjs
      - name: Upload diagnostic evidence
        id: artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-gui-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: gui-evidence/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Link evidence from PR check summary
        if: always() && steps.artifact.outcome == 'success'
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: printf '\n[Download GUI screenshots, traces and diagnostics](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"


  backup:
    name: Backup mobile GUI (independent)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BRANCH: ${{ github.head_ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      CI: "true"
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Install locked dependencies and build
        id: backup_build
        timeout-minutes: 4
        run: |
          node e2e/run-stage.mjs backup-app-install npm ci --ignore-scripts
          node e2e/run-stage.mjs backup-build npm run build:pages
          node e2e/run-stage.mjs backup-gui-install npm ci --prefix e2e --ignore-scripts
      - name: Install fixed browsers with bounded setup
        id: backup_browsers
        timeout-minutes: 5
        run: |
          node e2e/run-stage.mjs backup-apt-config sudo --preserve-env=GITHUB_ACTIONS "$(command -v node)" e2e/configure-ci-apt.mjs
          node e2e/run-stage.mjs backup-browser-install timeout --signal=TERM --kill-after=10s 280s node e2e/node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Backup workflow contracts
        id: backup_contract
        run: node e2e/run-stage.mjs backup-contract node --test e2e/backup-ci.node-test.mjs
      - name: Eight backup mobile cases (five-minute limit)
        id: backup_gui
        run: node e2e/run-stage.mjs backup-gui timeout --signal=TERM --kill-after=10s 300s node e2e/run-backup-gui.mjs
      - name: Preserve independent outcomes
        if: always()
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          mkdir -p gui-evidence
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const record = { job: 'backup', expectedSha: process.env.EXPECTED_SHA, run: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT, node: process.version, image: process.env.ImageOS, imageVersion: process.env.ImageVersion, recordedAt: new Date().toISOString(), steps: JSON.parse(process.env.STEP_OUTCOMES) };
          writeFileSync('gui-evidence/backup-ci-outcomes.json', JSON.stringify(record, null, 2) + '\n');
          NODE
          node e2e/evidence-inventory.mjs
      - name: Upload independent backup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-backup-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: gui-evidence/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

