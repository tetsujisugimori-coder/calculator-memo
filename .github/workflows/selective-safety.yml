name: Selective restore Stage 3A acceptance
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: stage3a-${{ github.event.pull_request.number }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  selective-safety:
    name: Stage 3A read-only mobile GUI (independent)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BRANCH: ${{ github.head_ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      CI: "true"
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Install locked dependencies and build
        id: selective-safety_build
        timeout-minutes: 4
        run: |
          node e2e/run-stage.mjs selective-safety-app-install npm ci --ignore-scripts
          node e2e/run-stage.mjs selective-safety-build npm run build:pages
          node e2e/run-stage.mjs selective-safety-gui-install npm ci --prefix e2e --ignore-scripts
      - name: Install fixed browsers with bounded setup
        id: selective-safety_browsers
        timeout-minutes: 5
        run: |
          node e2e/run-stage.mjs selective-safety-apt-config sudo --preserve-env=GITHUB_ACTIONS "$(command -v node)" e2e/configure-ci-apt.mjs
          node e2e/run-stage.mjs selective-safety-browser-install timeout --signal=TERM --kill-after=10s 280s node e2e/node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Restore plan workflow contracts
        id: selective-safety_contract
        run: node e2e/run-stage.mjs selective-safety-contract node --test e2e/selective-safety-ci.node-test.mjs
      - name: Eight selective-safety mobile cases (five-minute limit)
        id: selective-safety_gui
        run: node e2e/run-stage.mjs selective-safety-gui timeout --signal=TERM --kill-after=10s 300s node e2e/run-selective-safety-gui.mjs
      - name: Preserve independent outcomes
        if: always()
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          mkdir -p gui-evidence
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const record = { job: 'selective-safety', expectedSha: process.env.EXPECTED_SHA, run: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT, node: process.version, image: process.env.ImageOS, imageVersion: process.env.ImageVersion, recordedAt: new Date().toISOString(), steps: JSON.parse(process.env.STEP_OUTCOMES) };
          writeFileSync('gui-evidence/selective-safety-ci-outcomes.json', JSON.stringify(record, null, 2) + '\n');
          NODE
          node e2e/evidence-inventory.mjs
      - name: Upload independent selective-safety evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-selective-safety-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: gui-evidence/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
