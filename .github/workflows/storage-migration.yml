name: Stage 3B-5 isolated migration and branch rescue
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: storage-migration-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  isolated-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      CI: 'true'
    steps:
      - name: Checkout exact PR head
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Pinned Node
        id: node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Locked dependencies
        id: dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix e2e --ignore-scripts
      - name: Existing writer boundary and negative controls
        id: boundary
        run: |
          node e2e/run-stage.mjs storage-migration-boundary node e2e/storage-writer-boundary.mjs
          node e2e/run-stage.mjs storage-migration-boundary-controls node --test e2e/storage-writer-boundary.node-test.mjs
      - name: Migration evidence negative controls
        id: evidence_contract
        run: node e2e/run-stage.mjs migration-evidence-controls node --test e2e/storage-migration-evidence.node-test.mjs
      - name: Fixed browser setup
        id: browsers
        timeout-minutes: 5
        run: |
          node e2e/run-stage.mjs storage-migration-apt sudo --preserve-env=GITHUB_ACTIONS "$(command -v node)" e2e/configure-ci-apt.mjs
          node e2e/run-stage.mjs storage-migration-install timeout --signal=TERM --kill-after=10s 280s node e2e/node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Synthetic migrations, rescue and browser faults
        id: acceptance
        timeout-minutes: 6
        run: node e2e/run-stage.mjs storage-migration-browser timeout --signal=TERM --kill-after=10s 330s node e2e/run-storage-migration-gui.mjs
      - name: Independent RED and GREEN counterexamples
        id: independent
        if: always() && steps.browsers.outcome == 'success' && steps.boundary.outcome == 'success'
        timeout-minutes: 2
        run: node e2e/run-stage.mjs storage-migration-independent timeout --signal=TERM --kill-after=10s 100s node docs/maintenance/storage-migration-stage3b5/independent/review-browser.mjs
      - name: Preserve failures and outcomes
        if: always()
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          mkdir -p gui-evidence
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('gui-evidence/storage-migration-ci-outcomes.json', JSON.stringify({ sha: process.env.EXPECTED_SHA, run: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT, steps: JSON.parse(process.env.STEP_OUTCOMES) }, null, 2) + '\n');
          NODE
          node e2e/evidence-inventory.mjs
      - name: Upload isolated acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-storage-migration-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: |
            gui-evidence/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
